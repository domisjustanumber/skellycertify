name: Certify report
description: Send the report file of a certification run (see README.md).
title: "[certify] "
labels: ["certify-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your report. Read the whole report file before you send it.
        Do not write your name, contact details or other personal details in this form.
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example Windows 11, Ubuntu 24.04, macOS 15 on Apple Silicon.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware summary
      description: The model names only. For example CPU AMD Ryzen 7 7700X, GPU NVIDIA RTX 3070, camera Logitech C920.
    validations:
      required: true
  - type: dropdown
    id: producer
    attributes:
      label: Source of the report
      description: The program that wrote the report file.
      options:
        - freemocap app
        - skellytracker (run alone from its clone)
        - skellycam (run alone from its clone)
        - Other
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report file
      description: Attach the file `certify-report-<time>.md` here. If GitHub refuses it, rename it to `.txt`.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: A problem that you saw, if any. Do not write personal details.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I read the report and it holds no personal data.
          required: true
